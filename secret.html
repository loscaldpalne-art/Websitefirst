<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>部員認証 - 物理部</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .box {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 30px;
      border-radius: 8px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .box h2 {
      font-size: 1.2rem;
      margin-bottom: 8px;
      color: #f8fafc;
    }
    .box p {
      color: #94a3b8;
      font-size: 0.85rem;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #475569;
      border-radius: 6px;
      background: #0f172a;
      color: white;
      font-size: 0.95rem;
      margin: 15px 0;
      box-sizing: border-box;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #334155;
      color: white;
      border: 1px solid #475569;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:active {
      background: #1e293b;
    }
    #secret-content {
      display: none;
      text-align: left;
    }
    .info-list {
      margin: 15px 0;
      font-size: 0.85rem;
      line-height: 1.8;
      color: #cbd5e1;
    }
    .back-link {
      margin-top: 20px;
      color: #64748b;
      text-decoration: none;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- 認証画面 -->
  <div class="box" id="lock-screen">
    <h2>部員認証</h2>
    <p>指定のパスワードを入力してください。</p>
    <input type="password" id="passInput" placeholder="Password">
    <button onclick="checkPassword()">認証</button>
  </div>

  <!-- 認証成功後に表示 -->
  <div class="box" id="secret-content">
    <h2 style="text-align: center; margin-bottom: 15px;">認証完了</h2>
    <div class="info-list">
      ・部室Wi-Fi: physics-room<br>
      ・備品管理: 工具箱は元の場所へ戻すこと<br>
      ・連絡事項: 定例ミーティングは金曜放課後
    </div>
    <button style="margin-top: 15px;" onclick="location.reload()">終了</button>
  </div>

  <a href="index.html" class="back-link">&larr; トップに戻る</a>

  <script>
    function checkPassword() {
      const input = document.getElementById("passInput").value;
      const correctPass = "butsuri";

      if (input === correctPass) {
        document.getElementById("lock-screen").style.display = "none";
        document.getElementById("secret-content").style.display = "block";
      } else {
        alert("パスワードが一致しません。");
      }
    }
  </script>
</body>
</html>
