<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>私のホームページ</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    h1 {
      color: #2b7a78;
      font-size: 24px;
      margin-bottom: 10px;
    }
    p {
      line-height: 1.6;
      color: #555;
    }
    button {
      background-color: #3aafa9;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
      transition: background-color 0.2s;
    }
    button:active {
      background-color: #2b7a78;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎉 はじめてのウェブサイト</h1>
    <p>iPadとGitHubを使って、自分だけのホームページを作ることができました！</p>
    <button onclick="showMessage()">ここを押してみてね</button>
  </div>

  <script>
    function showMessage() {
      alert("おめでとうございます！サイトが正常に動いています ✨");
    }
  </script>
</body>
</html>
