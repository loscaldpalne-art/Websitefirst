<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio & Gallery</title>
  <style>
    /* 全体のリセットとフォント */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      color: #333;
      background-color: #fafafa;
      line-height: 1.6;
    }

    /* ナビゲーションバー（上に固定） */
    header {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      box-shadow: 0 1px 10px rgba(0,0,0,0.05);
      z-index: 100;
    }
    nav {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
    }
    .logo {
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: 1px;
      color: #111;
    }
    .nav-links {
      display: flex;
      gap: 20px;
      list-style: none;
    }
    .nav-links a {
      text-decoration: none;
      color: #666;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s;
    }
    .nav-links a:hover {
      color: #000;
    }

    /* トップのメインビジュアル */
    .hero {
      height: 75vh;
      background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
      padding: 20px;
    }
    .hero h1 {
      font-size: 2.5rem;
      letter-spacing: 2px;
      margin-bottom: 15px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }
    .hero p {
      font-size: 1.1rem;
      max-width: 600px;
      opacity: 0.9;
    }

    /* セクション共通 */
    .section {
      max-width: 900px;
      margin: 0 auto;
      padding: 80px 20px;
    }
    .section-title {
      font-size: 1.8rem;
      text-align: center;
      margin-bottom: 40px;
      position: relative;
    }
    .section-title::after {
      content: '';
      display: block;
      width: 40px;
      height: 3px;
      background: #333;
      margin: 10px auto 0;
      border-radius: 2px;
    }

    /* 自己紹介セクション */
    .about-content {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.03);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .about-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    /* 写真ギャラリー */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .gallery-item {
      overflow: hidden;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      transition: transform 0.3s ease;
    }
    .gallery-item:hover {
      transform: translateY(-5px);
    }
    .gallery-item img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }
    .gallery-item p {
      padding: 12px 16px;
      font-size: 0.9rem;
      color: #666;
    }

    /* フッター */
    footer {
      background: #222;
      color: #aaa;
      text-align: center;
      padding: 30px 20px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- ナビゲーションメニュー -->
  <header>
    <nav>
      <div class="logo">MY SITE</div>
      <ul class="nav-links">
        <li><a href="#hero">ホーム</a></li>
        <li><a href="#about">私について</a></li>
        <li><a href="#gallery">ギャラリー</a></li>
      </ul>
    </nav>
  </header>

  <!-- メイン写真とタイトル -->
  <div class="hero" id="hero">
    <h1>Welcome to My Website</h1>
    <p>iPadとGitHubで作った、私のお気に入りや写真を集めたスペースです。</p>
  </div>

  <!-- 私について -->
  <section class="section" id="about">
    <h2 class="section-title">About Me</h2>
    <div class="about-content">
      <img class="about-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="プロフィール写真">
      <h3>あなたの名前</h3>
      <p style="margin-top: 10px; max-width: 500px;">
        こんにちは！ここに簡単な自己紹介や好きなこと、趣味、普段やっていることなどを書くことができます。
      </p>
    </div>
  </section>

  <!-- 写真ギャラリー -->
  <section class="section" id="gallery">
    <h2 class="section-title">Gallery</h2>
    <div class="gallery-grid">
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80" alt="海">
        <p>夏の綺麗な海の景色</p>
      </div>
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1511497584788-87676104235f?auto=format&fit=crop&w=600&q=80" alt="森">
        <p>静かな森の朝の散歩</p>
      </div>
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=600&q=80" alt="カフェ">
        <p>お気に入りのカフェのコーヒー</p>
      </div>
    </div>
  </section>

  <!-- フッター -->
  <footer>
    <p>© 2026 My Website. Created with iPad & GitHub.</p>
  </footer>

</body>
</html>
