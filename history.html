<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>沿革 - 物理部</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      line-height: 1.7;
      padding: 30px 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 25px;
      color: #0f172a;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .header {
      margin-bottom: 40px;
      border-bottom: 2px solid #0f172a;
      padding-bottom: 15px;
    }
    .header h1 {
      font-size: 1.5rem;
      color: #0f172a;
    }
    .header p {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 5px;
    }

    /* タイムライン */
    .timeline {
      position: relative;
      border-left: 2px solid #cbd5e1;
      margin-left: 10px;
      padding-left: 25px;
    }
    .timeline-item {
      position: relative;
      margin-bottom: 35px;
    }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: -31px;
      top: 5px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #0f172a;
      border: 2px solid #fff;
    }
    .timeline-year {
      font-size: 0.85rem;
      font-weight: 700;
      color: #475569;
      margin-bottom: 4px;
    }
    .timeline-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .timeline-desc {
      font-size: 0.9rem;
      color: #475569;
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-link">&larr; トップページに戻る</a>

  <div class="header">
    <h1>物理部 沿革</h1>
    <p>部および部室環境の変遷の記録</p>
  </div>

  <div class="timeline">

    <div class="timeline-item">
      <div class="timeline-year">2018年</div>
      <div class="timeline-title">物理同好会として発足</div>
      <div class="timeline-desc">有志数名により理科準備室の片隅で活動を開始。</div>
    </div>

    <div class="timeline-item">
      <div class="timeline-year">2020年</div>
      <div class="timeline-title">部に昇格・専用部室の獲得</div>
      <div class="timeline-desc">正式な部活動として認可され、現在の部室へ移転。</div>
    </div>

    <div class="timeline-item">
      <div class="timeline-year">2022年</div>
      <div class="timeline-title">部室インフラの整備</div>
      <div class="timeline-desc">有志による寄贈により、ソファおよび小型冷蔵庫が配備される。居心地が大幅に向上。</div>
    </div>

    <div class="timeline-item">
      <div class="timeline-year">2024年</div>
      <div class="timeline-title">電子工作・情報系の活動拡大</div>
      <div class="timeline-desc">マイコン制御やWeb技術の導入が進み、実験とITの複合的な活動が定着。</div>
    </div>

    <div class="timeline-item">
      <div class="timeline-year">現在</div>
      <div class="timeline-title">公式Webサイト開設</div>
      <div class="timeline-desc">部外への情報発信および部員専用アーカイブの運用を開始。</div>
    </div>

  </div>

</body>
</html>
